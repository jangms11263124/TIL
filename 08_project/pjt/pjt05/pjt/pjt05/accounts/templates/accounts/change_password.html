{% extends 'community/base.html' %}

{% block title %}비밀번호 변경 - 금융 자산 커뮤니티{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
  <h1 class="page-title">비밀번호 변경</h1>
  <p class="breadcrumb">보안을 위해 비밀번호를 주기적으로 변경해 주세요.</p>
  
  <form action="{% url 'accounts:change_password' %}" method="POST" class="mt-2">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom: 1.25rem;">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div style="color: var(--color-danger); font-size: 0.8rem; margin-top: 0.25rem;">
            {{ field.errors.0 }}
          </div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="mt-2">
      <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">비밀번호 변경</button>
    </div>
  </form>
</div>

<style>
  input[type="password"] {
    width: 100%;
    padding: 0.625rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-btn);
    font-size: 0.9375rem;
  }
</style>
{% endblock %}
