<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업계 큰손님의 프로필 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">💰 업계 큰손님의 프로필 페이지</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto nav-pills" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#profile" type="button" role="tab">프로필
              수정</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#portfolio" type="button" role="tab">포트폴리오
              수정</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container tab-content">

    <div class="tab-pane fade show active" id="profile" role="tabpanel">
      <div class="section-card">
        <h3 class="mb-4 fw-bold">프로필 수정</h3>
        <div class="row">
          <div class="col-md-5 text-center d-flex flex-column align-items-center">
            <img src="dong.png" alt="프로필 이미지" class="profile-img">
            <div class="w-100 mt-3">
              <label class="form-label fw-bold">자기 소개</label>
              <textarea class="form-control mb-2" rows="4"
                placeholder="자신을 소개해주세요.">안녕하세요! 한국의 일론 머스크를 꿈꾸는 김동언입니다.</textarea>
              <button class="btn btn-primary w-100">소개 업데이트</button>
            </div>
          </div>

          <div class="col-md-7 right-panel">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label text-muted">회원 번호</label>
                <input type="text" class="form-control bg-dark text-muted" value="15-0306" readonly>
              </div>
              <div class="col-sm-6">
                <label class="form-label text-muted">ID</label>
                <input type="text" class="form-control bg-dark text-muted" value="MoneyJoa" readonly>
              </div>

              <div class="col-sm-12 col-md-5">
                <label class="form-label">Nickname</label>
                <input type="text" class="form-control" placeholder="닉네임을 설정해주세요" value="업계 큰손">
              </div>
              <div class="col-sm-12 col-md-7">
                <label class="form-label">Email</label>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="이메일을 설정해주세요">
                  <select class="form-select" style="max-width: 150px;">
                    <option value="" selected>직접입력</option>
                    <option value="@naver.com">@naver.com</option>
                    <option value="@gmail.com">@gmail.com</option>
                    <option value="@daum.net">@daum.net</option>
                    <option value="@ssafy.com">@ssafy.com</option>
                  </select>
                </div>
              </div>

              <div class="col-sm-6 mt-3">
                <label class="form-label">나이</label>
                <select class="form-select">
                  <option value="20" selected>20대</option>
                  <option value="30">30대</option>
                  <option value="40">40대</option>
                  <option value="50">50대</option>
                  <option value="60">60대</option>
                  <option value="70">70대 이상</option>
                </select>
              </div>
              <div class="col-sm-6 mt-3">
                <label class="form-label">직업군</label>
                <select class="form-select">
                  <option value="student">학생</option>
                  <option value="job_seeker" selected>취업준비생</option>
                  <option value="housewife">주부</option>
                  <option value="office_worker">직장인(급여생활자)</option>
                  <option value="freelancer">프리랜서</option>
                  <option value="business_owner">개인사업자(자영업)</option>
                  <option value="professional">전문직</option>
                  <option value="retired">퇴직/은퇴자</option>
                  <option value="unemployed">무직</option>
                </select>
              </div>

              <div class="col-sm-6 mt-3">
                <label class="form-label">결혼 여부</label>
                <select class="form-select">
                  <option value="single" selected>미혼</option>
                  <option value="married">기혼</option>
                </select>
              </div>
              <div class="col-sm-6 mt-3">
                <label class="form-label">주거 형태</label>
                <select class="form-select">
                  <option value="jeonse" selected>전세</option>
                  <option value="monthly">월세</option>
                  <option value="own">자가</option>
                  <option value="dorm">기숙사/본가</option>
                </select>
              </div>

              <div class="col-12 mt-4">
                <label class="form-label d-flex justify-content-between">
                  <span>현재 자산 🚀</span>
                  <span class="text-info fw-bold" id="assetVal">0원</span>
                </label>
                <input type="range" class="form-range" min="0" max="100000" step="100" value="0" id="assetRange">
                <small class="text-muted text-end d-block">MAX: 1,245조 (일론 머스크)</small>
              </div>
              <div class="col-12 mt-3">
                <label class="form-label d-flex justify-content-between">
                  <span>연봉</span>
                  <span class="text-info fw-bold" id="salaryVal">0원</span>
                </label>
                <input type="range" class="form-range" min="0" max="100000" step="500" value="0" id="salaryRange">
                <small class="text-muted text-end d-block">MAX: 10억 이상</small>
              </div>

              <div class="col-12 mt-4 text-end">
                <button class="btn btn-info px-4">프로필 저장</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="portfolio" role="tabpanel">
      <div class="section-card">
        <h3 class="mb-4 fw-bold">포트폴리오 수정</h3>
        <div class="row g-4">

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">🎯 투자 목적</label>
            <select class="form-select mb-3">
              <option>시드머니(목돈) 마련</option>
              <option>내 집 마련</option>
              <option>노후/은퇴 준비</option>
              <option selected>단기 수익 창출</option>
            </select>

            <label class="form-label fw-bold text-info">⚡ 위험 감수 성향</label>
            <div class="d-flex gap-3 mb-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="risk" id="risk1">
                <label class="form-check-label" for="risk1">안전제일형</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="risk" id="risk2" checked>
                <label class="form-check-label" for="risk2">중도수익형</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="risk" id="risk3">
                <label class="form-check-label" for="risk3">공격투자형</label>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">⏳ 희망 투자 기간</label>
            <select class="form-select mb-3">
              <option>1년 미만 (단기)</option>
              <option selected>1년 ~ 3년 (중기)</option>
              <option>3년 이상 (장기)</option>
            </select>

            <label class="form-label fw-bold text-info">💰 월평균 가용 가능 자금</label>
            <select class="form-select mb-3">
              <option>50만 원 미만</option>
              <option selected>50만 원 ~ 100만 원</option>
              <option>100만 원 ~ 300만 원</option>
              <option>300만 원 이상</option>
            </select>
          </div>

          <hr class="border-secondary">

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">📈 선호 자산군 (다중 선택)</label>
            <div class="row px-3">
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="asset1" checked>
                <label class="form-check-label" for="asset1">국내 주식</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="asset2">
                <label class="form-check-label" for="asset2">해외 주식</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="asset3" checked>
                <label class="form-check-label" for="asset3">ETF/펀드</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="asset4">
                <label class="form-check-label" for="asset4">예·적금</label>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">🏭 관심 산업 (다중 선택)</label>
            <div class="row px-3">
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="ind1" checked>
                <label class="form-check-label" for="ind1">화학/에너지</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="ind2" checked>
                <label class="form-check-label" for="ind2">IT/소프트웨어</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="ind3">
                <label class="form-check-label" for="ind3">바이오/헬스케어</label>
              </div>
              <div class="form-check col-6">
                <input class="form-check-input" type="checkbox" id="ind4">
                <label class="form-check-label" for="ind4">친환경/ESG</label>
              </div>
            </div>
          </div>

          <hr class="border-secondary mt-4">

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">🏦 주거래 은행 </label>
            <div class="row px-3">
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank1" checked><label
                  class="form-check-label" for="bank1">KB국민은행</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank2"><label
                  class="form-check-label" for="bank2">신한은행</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank3"><label
                  class="form-check-label" for="bank3">우리은행</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank4"><label
                  class="form-check-label" for="bank4">하나은행</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank5"><label
                  class="form-check-label" for="bank5">NH농협은행</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="bank6" checked><label
                  class="form-check-label" for="bank6">토스/카카오뱅크</label></div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold text-info">🏢 선호 금융사 </label>
            <div class="row px-3">
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin1" checked><label
                  class="form-check-label" for="fin1">삼성증권</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin2"><label
                  class="form-check-label" for="fin2">미래에셋증권</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin3" checked><label
                  class="form-check-label" for="fin3">한국투자증권</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin4"><label
                  class="form-check-label" for="fin4">KB증권</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin5"><label
                  class="form-check-label" for="fin5">NH투자증권</label></div>
              <div class="form-check col-6"><input class="form-check-input" type="checkbox" id="fin6" checked><label
                  class="form-check-label" for="fin6">토스증권</label></div>
            </div>
          </div>

          <div class="col-12 mt-4 text-end">
            <button class="btn btn-info px-4">포트폴리오 저장</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function formatKoreanCurrency(value) {
      if (value == 0) return "0원";

      let result = "";
      let jo = Math.floor(value / 100000000);
      let eok = Math.floor((value % 100000000) / 10000);
      let man = value % 10000;

      if (jo > 0) result += jo + "조 ";
      if (eok > 0) result += eok + "억 ";
      if (man > 0) result += man + "만 ";

      return result.trim() + "원";
    }

    // 자산 슬라이더: 10억(100,000) 이상 도달 시 일론 머스크 자산으로 변환
    const assetRange = document.getElementById('assetRange');
    const assetVal = document.getElementById('assetVal');
    assetRange.addEventListener('input', function () {
      if (this.value >= 100000) {
        assetVal.innerText = "1,245조 원 (일론 머스크)";
      } else {
        assetVal.innerText = formatKoreanCurrency(this.value);
      }
    });

    // 연봉 슬라이더
    const salaryRange = document.getElementById('salaryRange');
    const salaryVal = document.getElementById('salaryVal');
    salaryRange.addEventListener('input', function () {
      if (this.value >= 100000) {
        salaryVal.innerText = "10억 이상";
      } else {
        salaryVal.innerText = formatKoreanCurrency(this.value);
      }
    });
  </script>
</body>

</html>
