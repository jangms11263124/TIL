  { section: true, wbs: '1.2', label: '백엔드 개발 (Django REST Framework)', phase: 'back', phaseLabel: '백엔드', start: 3, end: 7 },
  { wbs: '1.2.1', label: '회원 인증 (로그인·회원가입)', phase: 'back', start: 3, end: 3.5 },
  { wbs: '1.2.2', label: '금융감독원 API 연동', phase: 'back', start: 3.5, end: 4.5 },
  { wbs: '1.2.3', label: '콘텐츠 추천 알고리즘 구현', phase: 'back', start: 4.5, end: 5.5 },
  { wbs: '1.2.4', label: '커뮤니티 API (댓글·좋아요·랭킹)', phase: 'back', start: 5.5, end: 6 },

  { wbs: '1.3.2', label: '홈·콘텐츠 목록·상세 페이지', phase: 'front', start: 3.5, end: 4.5 },
  { wbs: '1.3.3', label: 'AI 금융 상품 추천·비교 페이지', phase: 'front', start: 4.5, end: 5 },
  { wbs: '1.3.4', label: '퀴즈·캘린더·AI 추천 카드 페이지', phase: 'front', start: 5, end: 6 },
  { wbs: '1.3.5', label: '지도 API 연동 (오프라인 강의)', phase: 'front', start: 6, end: 6.5 },

];

const TOTAL_DAYS = 10;
const CELL_W = 32;

function pct(val) { return ((val - 1) / TOTAL_DAYS * 100).toFixed(2) + '%'; }
function pctW(dur) { return (dur / TOTAL_DAYS * 100).toFixed(2) + '%'; }

const tbody = document.getElementById('gantt-body');

tasks.forEach(t => {
  const tr = document.createElement('tr');
  if (t.section) tr.className = 'section-row';

  const dur = t.end - t.start;
  const color = PHASE_COLORS[t.phase];

  const barOpacity = t.section ? '1' : '0.82';
  const barH = t.section ? '20px' : '16px';
  const borderRadius = t.section ? '4px' : '3px';

  const durText = dur === 1 ? '1일' : dur % 1 === 0 ? dur + '일' : dur + '일';

  let labelHtml = '';
  if (t.section) {
    labelHtml = `<span class="section-label">${t.label}</span>
      <span class="phase-badge" style="background:${color.badge_bg};color:${color.badge_txt};">${t.phaseLabel}</span>`;
  } else {
    const indent = '&nbsp;&nbsp;&nbsp;&nbsp;';
    const tbdBadge = t.tbd ? `<span style="font-size:10px;color:#888;margin-left:5px;">TBD</span>` : '';
    labelHtml = `${indent}<span style="font-size:13px;color:var(--color-text-secondary);">${t.label}</span>${tbdBadge}`;
  }

  const barLeft = ((t.start - 1) / TOTAL_DAYS * 100).toFixed(2) + '%';
  const barWidth = ((t.end - t.start) / TOTAL_DAYS * 100).toFixed(2) + '%';

  const barOpacityVal = t.tbd ? 0.5 : (t.section ? 1 : 0.85);

  const gridLines = Array.from({ length: TOTAL_DAYS - 1 }, (_, i) =>
    `<div class="grid-line" style="left:${((i + 1) / TOTAL_DAYS * 100).toFixed(2)}%;"></div>`
  ).join('');

  tr.innerHTML = `
    <td class="wbs-col">${t.wbs}</td>
    <td class="label-col">${labelHtml}</td>
    <td class="bar-cell" colspan="${TOTAL_DAYS}" style="padding:0;">
      <div style="position:relative;width:100%;height:28px;">
        ${gridLines}
        <div class="bar" style="
          left:${barLeft};
          width:${barWidth};
          height:${t.section ? '20px' : '16px'};
          background:${color.bar};
          opacity:${barOpacityVal};
          border-radius:${t.section ? '4px' : '3px'};
        "></div>
      </div>
    </td>
    <td class="dur-col">${dur % 1 === 0 ? dur + '일' : dur + '일'}</td>
  `;

  tbody.appendChild(tr);

  if (!t.section) {
    const sep = document.createElement('tr');
    sep.innerHTML = `<td colspan="13" style="padding:0;height:1px;"></td>`;
    tbody.appendChild(sep);

</script>
