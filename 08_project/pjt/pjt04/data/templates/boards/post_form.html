{% extends 'base.html' %}

{% block content %}
<!-- jQuery 및 Summernote Lite CDN 로드 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

<div style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-bottom: 30px; font-size: 1.8rem;">{{ asset.name }} - 게시글 {{ action }}</h2>
    
    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="{{ form.title.id_for_label }}">제목</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>
            
            <div class="form-group">
                <label class="form-label" for="{{ form.author.id_for_label }}">작성자</label>
                {{ form.author }}
                {{ form.author.errors }}
            </div>
            
            <div class="form-group">
                <label class="form-label" for="{{ form.content.id_for_label }}">내용</label>
                {{ form.content }}
                {{ form.content.errors }}
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary">{{ action }} 완료</button>
                <a href="{% if post %}{% url 'boards:post_detail' asset.id post.pk %}{% else %}{% url 'boards:board_list' asset.id %}{% endif %}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Django form의 textarea 기본 ID인 id_content를 Summernote로 변환
        $('#id_content').summernote({
            placeholder: '자유롭게 다채로운 의견을 남겨주세요. 사진 첨부, 폰트 색상 및 볼드 처리 등 모두 가능합니다!',
            tabsize: 2,
            height: 450,
            lang: 'ko-KR',
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture', 'video']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ],
            // 다크모드 UI(card) 강제 오버라이딩 (흰색 배경 유지)
            callbacks: {
                onInit: function() {
                    $('.note-editor').parent().css('border-radius', '12px').css('overflow', 'hidden');
                }
            }
        });
    });
</script>

<style>
    /* 다크모드 테마 내에서도 에디터는 환하게 보이기 위해 강제 흰색 적용 */
    .note-editor.note-frame {
        background: #ffffff !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 12px !important;
        overflow: hidden;
    }
    .note-editable {
        background-color: #ffffff !important;
        color: #333333 !important;
        font-family: 'Pretendard', sans-serif !important;
        font-size: 1.1rem;
    }
    .note-toolbar {
        background-color: #f8f9fa !important;
        border-bottom: 1px solid #e9ecef !important;
    }
    /* Summernote 모달 및 팝업창 스타일 개선 */
    .note-modal-content {
        background-color: #ffffff;
        color: #333;
    }
    .note-form-label {
        color: #333 !important;
    }
    .note-icon-caret {
        display: none;
    }
    .note-dropdown-menu {
        background-color: #fff;
    }
</style>
{% endblock %}
