<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const students = [
      { name: 'Alice', scores: [85, 90, 95] },
      { name: 'Bella', scores: [50, 80, 80] },
      { name: 'Caley', scores: [90, 55, 35] },
      { name: 'Dave', scores: [100, 100, 100] },
      { name: 'Eve', scores: [88, 90, 92] }
    ]
    // 아래에 코드 작성
    
    // makeAvgScores1 - for statement
    function makeAvgScores1(students) {
      const result = {};
      for (let i = 0; i < students.length; i++) {
        const student = students[i];
        const avgScore = student.scores.reduce((sum, score) => sum + score, 0) / student.scores.length;
        result[student.name] = avgScore;
      }
      return result;
    }
    
    // makeAvgScores2 - for...of statement
    function makeAvgScores2(students) {
      const result = {};
      for (const student of students) {
        const avgScore = student.scores.reduce((sum, score) => sum + score, 0) / student.scores.length;
        result[student.name] = avgScore;
      }
      return result;
    }
    
    // makeAvgScores3 - Array Helper Methods
    function makeAvgScores3(students) {
      return students.reduce((result, student) => {
        const avgScore = student.scores.reduce((sum, score) => sum + score, 0) / student.scores.length;
        result[student.name] = avgScore;
        return result;
      }, {});
    }

    const result1 = makeAvgScores1(students)
    const result2 = makeAvgScores2(students)
    const result3 = makeAvgScores3(students)
    console.log(result1)
    console.log(result2)
    console.log(result3)
  </script>
</body>

</html>
