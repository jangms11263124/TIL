<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      width: 100%;
      border: 1px solid black;
      border-collapse: collapse;
    }

    td {
      width: 50px;
      height: 50px;
      border: 1px solid black;
      text-align: center;
    }

    .theme-color {
      background-color: crimson;
      color: white;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
    </tr>
    <tr>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
    </tr>
    <tr>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
      <td>Lorem, ipsum dolor.</td>
    </tr>
  </table>

  <script>
    // 아래에 코드 작성
    const tableTag = document.querySelector("table")
  
    const clickHandler = function(event) {
      // 클릭된 요소가 td(셀)인지 확인
      if (event.target.tagName === "TD") {
        // 클릭된 셀에 theme-color class를 toggle (있으면 제거, 없으면 추가)
        event.target.classList.toggle("theme-color")
      }
    }

    // table 요소에 이벤트 리스너 등록
    // 각 셀에서 발생한 클릭 이벤트가 버블링되어 table에 전달됨
    tableTag.addEventListener("click", clickHandler)
  </script>
</body>

</html>
