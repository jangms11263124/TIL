<html lang="en">

<head>

<body>
  <h1>인기 영화들</h1>
  <ul>

  </ul>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- axios CDN을 삽입한다. -->
  <script>
    const ulTag = document.querySelector('ul')

    const options = {
      method: 'GET',
      headers: {
        accept: 'application/json',
        Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI1Yzk4MmIzYTBjZTgwZGEzMmI2NmMyMzIxMjcwYmM3ZCIsIm5iZiI6MTc3OTI2MTQxNS41MDIsInN1YiI6IjZhMGQ1ZmU3YmFmZWRmOGFmOWVkYjViZSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.oxp8jc_q83BS9L9E6HQkEn93Edwz6n49EnoVmUctkLQ'
      }
    };
    axios('https://api.themoviedb.org/3/movie/popular?language=ko-KR&page=1', options)
      .then(response => {
        console.log(response)
        const moveies = response.data.results

        const filteredMovies = moveies.filter(movie => movie.vote_average >= 7)
        filteredMovies.forEach(movie => {
          const liTag = document.createElement('li')

          liTag.textContent = `${movie.title}`

          ulTag.appendChild(liTag)
        })
      })
      .catch(err => {
        console.error('데이터를 불러오는 중 에러 발생:', err)
      })
    // 코드를 입력한다.

  </script>
</body>
